<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Submit a review for your product by rating its quality, selecting useful features, choosing the installation date, and sharing your experience.">
    <meta name="author" content="Emmanuel O. Afolabi">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>

        <form method="get" action="review.html">

            <!-- Product Name -->

            <div class="form-group">

                <label for="product">
                    Product Name *
                </label>

                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product...</option>
                </select>

            </div>

            <!-- Rating -->

            <div class="form-group">

                <p>Overall Rating *</p>

                <input type="radio" id="one" name="rating" value="1" required>
                <label for="one">☆ 1</label>

                <input type="radio" id="two" name="rating" value="2" required>
                <label for="two">☆☆ 2</label>

                <input type="radio" id="three" name="rating" value="3" required>
                <label for="three">☆☆☆ 3</label>

                <input type="radio" id="four" name="rating" value="4" required>
                <label for="four">☆☆☆☆ 4</label>

                <input type="radio" id="five" name="rating" value="5" required>
                <label for="five">☆☆☆☆☆ 5</label>

            </div>

            <!-- Installation Date -->

            <div class="form-group">

                <label for="installDate">
                    Date of Installation *
                </label>

                <input type="date" id="installDate" name="installDate" required>

            </div>

            <!-- Features -->

            <div class="form-group">

                <p>Useful Features</p>

                <p>Useful Features</p>
                <small>(Check all that apply)</small>

                <input type="checkbox" id="durability" name="features" value="Durability">
                <label for="durability">Durability</label>

                <input type="checkbox" id="ease" name="features" value="Ease of Use">
                <label for="ease">Ease of Use</label>

                <input type="checkbox" id="performance" name="features" value="Performance">
                <label for="performance">Performance</label>

                <input type="checkbox" id="design" name="features" value="Design">
                <label for="design">Design</label>

            </div>

            <!-- Review -->

            <div class="form-group">

                <label for="review">
                    Written Review (Optional)
                </label>



                <textarea id="review" name="review" rows="6"></textarea>

            </div>

            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    Your Name (Optional)
                </label>

                <input type="text" id="username" name="username">

            </div>

            <!-- Submit -->

            <input type="submit" value="Post Review" class="submit-btn">

        </form>

    </main>

    <footer>
        <p>
            &copy; <span id="year"></span> 🌺 Emmanuel O. Afolabi 🌺 | Liberia
        </p>

        <p id="lastModified"></p>
    </footer>
</body>

</html>
