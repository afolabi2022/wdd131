<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form">
    <meta name="author" content="Emmanuel O. Afolabi">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>

        <form method="get" action="review.html">

            <!-- Product Name -->

            <div class="form-group">

                <label for="product">
                    Product Name *
                </label>

                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product...</option>
                </select>

            </div>

            <!-- Rating -->

            <div class="form-group">

                <p>Overall Rating *</p>

                <label>
                    <input type="radio" name="rating" id="one" value="1" required>
                    ☆ 1
                </label>

                <label>
                    <input type="radio" name="rating" id="two" value="2">
                    ☆☆ 2
                </label>

                <label>
                    <input type="radio" name="rating" id="three" value="3">
                    ☆☆☆ 3
                </label>

                <label>
                    <input type="radio" name="rating" id="four" value="4">
                    ☆☆☆☆ 4
                </label>

                <label>
                    <input type="radio" name="rating" id="five" value="5">
                    ☆☆☆☆☆ 5
                </label>

            </div>

            <!-- Installation Date -->

            <div class="form-group">

                <label for="installDate">
                    Date of Installation *
                </label>

                <input type="date" id="installDate" name="installDate" required>

            </div>

            <!-- Features -->

            <div class="form-group">

                <p>Useful Features</p>

                <label>
                    <input type="checkbox" name="features" id="durability" value="Durability">

                    Durability
                </label>

                <label>
                    <input type="checkbox" name="features" id="ease" value="Ease of Use">

                    Ease of Use
                </label>

                <label>
                    <input type="checkbox" name="features" id="performance" value="Performance">

                    Performance
                </label>

                <label>
                    <input type="checkbox" name="features" id="design" value="Design">

                    Design
                </label>

            </div>

            <!-- Review -->

            <div class="form-group">

                <label for="review">
                    Written Review (Optional)
                </label>



                <textarea id="review" name="review" rows="6"></textarea>

            </div>

            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    Your Name (Optional)
                </label>

                <input type="text" id="username" name="username">

            </div>

            <!-- Submit -->

            <input type="submit" value="Post Review" class="submit-btn">

        </form>

    </main>

    <footer>
        <p>
            &copy; <span id="year"></span> 🌺 Emmanuel O. Afolabi 🌺 | Liberia
        </p>

        <p id="lastModified"></p>
    </footer>
</body>

</html>
