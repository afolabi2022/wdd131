<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="AFEM TECH provides web development, graphic design, AI solutions, and software development services for individuals and businesses.">

    <meta name="author" content="Emmanuel O. Afolabi">

    <title>AFEM TECH | Contact</title>

    <link rel="stylesheet" href="styles/project.css">
    <link rel="stylesheet" href="styles/project-large.css">

    <script src="scripts/project.js" defer></script>

</head>

<body>

    <header>

        <nav class="navbar">

            <div class="logo">

                <img src="images/logo.png" alt="AFEM TECH Logo">

                <h1>AFEM TECH</h1>

            </div>

            <ul class="nav-links">

                <li><a href="index.html">Home</a></li>

                <li><a href="about.html">About</a></li>

                <li><a href="services.html">Services</a></li>

                <li><a href="contact.html">Contact</a></li>

                <li><a href="references.html">References</a></li>

            </ul>

        </nav>

    </header>

    <main>

        <section class="contact">

            <h2>Contact AFEM TECH</h2>

            <p id="welcomeMessage"></p>

            <form id="contactForm">

                <label for="name">Full Name</label>

                <input type="text" id="name" required>

                <label for="email">Email Address</label>

                <input type="email" id="email" required>

                <label for="message">Message</label>

                <textarea id="message" rows="6" required></textarea>

                <input type="submit" value="Send Message" class="btn">

            </form>

        </section>

    </main>

    <footer>

        <p>
            &copy; <span id="year"></span> AFEM TECH | Emmanuel O. Afolabi | Liberia
        </p>

        <p id="lastModified"></p>

    </footer>

</body>
